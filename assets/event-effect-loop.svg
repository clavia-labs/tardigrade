<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410" role="img" aria-labelledby="title description">
  <title id="title">The event and effect loop</title>
  <desc id="description">Events feed atoms, which derive state and describe an effect. The runtime executes the effect in the world, then records the result as an event that feeds the atoms.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#3454d1" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <path d="M690 30 V328" fill="none" stroke="#d0d7de" stroke-width="1.4" stroke-dasharray="5 7"/>
  <g fill="#f3f5ff" stroke="#3454d1" stroke-width="1.8">
    <rect x="30" y="140" width="320" height="145"/>
    <rect x="445" y="170" width="190" height="95"/>
  </g>
  <g fill="#57606a" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="17" text-anchor="middle">
    <text x="190" y="64">Event</text>
    <text x="672" y="52" text-anchor="end">Pure</text>
    <text x="708" y="52" text-anchor="start">Effectful</text>
    <text x="800" y="180">runtime executes</text>
    <text x="800" y="255">I/O</text>
    <text x="1000" y="128">World</text>
    <text x="190" y="221">derive state</text>
    <text x="190" y="252">describe next action</text>
    <text x="540" y="310">description</text>
    <text x="595" y="388">result recorded as an event</text>
  </g>
  <g fill="#3454d1" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="22" text-anchor="middle">
    <text x="190" y="182">Atoms</text>
    <text x="540" y="225">Effect</text>
  </g>
  <g fill="none" stroke="#3454d1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M190 84 V125"/>
    <path d="M364 215 H430"/>
    <path d="M650 215 H925"/>
    <path d="M1000 289 V350 H190 V300"/>
  </g>
  <g fill="none" stroke="#3454d1">
    <circle cx="1000" cy="215" r="60" stroke-width="1.8"/>
    <g stroke-width="1.1" opacity="0.5">
      <ellipse cx="1000" cy="215" rx="23" ry="60"/>
      <ellipse cx="1000" cy="215" rx="44" ry="60"/>
      <ellipse cx="1000" cy="215" rx="60" ry="23"/>
      <path d="M1000 155 V275"/>
    </g>
  </g>
</svg>
