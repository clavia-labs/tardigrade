name: publish

# release-please keeps a stable release PR current on main. Each revision of that PR is published
# as an RC. Merging it tags and publishes the stable version through OIDC. The workflow filename is
# part of the npm trust pin. bun publish does not speak OIDC, so tools/publish.ts packs with bun and
# uploads with npm.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack without publishing
        type: boolean
        default: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  RC_TYPE: rc
  RC_NPM_TAG: next
  RELEASE_PR_BRANCH_PREFIX: release-please--
  RELEASE_PR_LABEL: "autorelease: pending"
  RELEASE_PR_PAGE_SIZE: 100
  STABLE_NPM_TAG: latest

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate_base: ${{ github.sha }}
      candidate_head: ${{ steps.candidate.outputs.head }}
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
      - name: Pin release candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidates=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=${RELEASE_PR_PAGE_SIZE}" | jq -c --arg label "$RELEASE_PR_LABEL" --arg prefix "$RELEASE_PR_BRANCH_PREFIX" --arg repo "$GITHUB_REPOSITORY" '[.[] | select(.head.repo.full_name == $repo and (.head.ref | startswith($prefix)) and any(.labels[]; .name == $label))]')
          count=$(jq length <<< "$candidates")
          if (( count > 1 )); then
            echo "::error::Found ${count} open Release Please PRs against main."
            exit 1
          fi
          if (( count == 0 )); then
            exit 0
          fi
          echo "head=$(jq -r '.[0].head.sha' <<< "$candidates")" >> "$GITHUB_OUTPUT"
          echo "pr=$(jq -r '.[0].number' <<< "$candidates")" >> "$GITHUB_OUTPUT"

  publish-candidate:
    needs: release-please
    if: needs.release-please.outputs.candidate_head != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.candidate_base }}
      - name: Apply release candidate
        env:
          CANDIDATE_HEAD: ${{ needs.release-please.outputs.candidate_head }}
        run: |
          git fetch --no-tags origin "$CANDIDATE_HEAD"
          git merge --no-commit --no-ff "$CANDIDATE_HEAD"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun install --frozen-lockfile
      - run: bun run gate
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Read candidate version
        id: candidate
        run: echo "version=$(jq -r .version package.json)-${RC_TYPE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Publish candidate
        run: bun run tools/publish.ts --version ${{ steps.candidate.outputs.version }} --tag ${RC_NPM_TAG}

  publish-stable:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun install --frozen-lockfile
      - run: bun run gate
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publish
        run: bun run tools/publish.ts --tag ${STABLE_NPM_TAG} ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && '--dry-run' || '' }}
