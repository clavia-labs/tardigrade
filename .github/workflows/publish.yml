name: publish

# release-please opens RC release PRs on next and stable release PRs on main.
# Merging a release PR tags the commit and publishes through OIDC. The workflow
# filename is part of the npm trust pin. bun publish does not speak OIDC, so
# tools/publish.ts packs with bun and uploads with npm.
on:
  push:
    branches: [main, next]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack without publishing
        type: boolean
        default: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          target-branch: ${{ github.ref_name }}
          config-file: ${{ github.ref_name == 'next' && 'release-please-config.next.json' || 'release-please-config.json' }}

  publish:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run gate
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publish
        run: bun run tools/publish.ts --tag ${{ github.ref_name == 'next' && 'next' || 'latest' }} ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && '--dry-run' || '' }}
