name: publish

# release-please keeps a stable release PR current on main. Each revision of that PR is published
# as an RC. Merging it tags and publishes the stable version through OIDC. The workflow filename is
# part of the npm trust pin. bun publish does not speak OIDC, so tools/publish.ts packs with bun and
# uploads with npm.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack without publishing
        type: boolean
        default: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISHED_PACKAGE: tardie
  RC_TYPE: rc
  RC_NPM_TAG: next
  RELEASE_PR_BRANCH_PREFIX: release-please--
  RELEASE_PR_AUTHOR: github-actions[bot]
  RELEASE_PR_LABEL: "autorelease: pending"
  RELEASE_PR_PAGE_SIZE: 100
  STABLE_NPM_TAG: latest

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate_base: ${{ github.sha }}
      candidate_head: ${{ steps.candidate.outputs.head }}
      release_created: ${{ steps.release.outputs.release_created }}
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify stable candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_version=$(jq -r '.["."]' .release-please-manifest.json)
          release_tag="v${current_version}"
          release_list=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=${RELEASE_PR_PAGE_SIZE}" | jq -r --arg author "$RELEASE_PR_AUTHOR" --arg prefix "$RELEASE_PR_BRANCH_PREFIX" --arg repo "$GITHUB_REPOSITORY" '.[] | select(.merged_at != null and .user.login == $author and .head.repo.full_name == $repo and (.head.ref | startswith($prefix))) | .merge_commit_sha')
          pending_shas=()
          while read -r release_sha; do
            if [ -z "$release_sha" ]; then
              continue
            fi
            if git merge-base --is-ancestor "$release_sha" HEAD && ! git merge-base --is-ancestor "$release_sha" "$release_tag"; then
              pending_shas+=("$release_sha")
            fi
          done <<< "$release_list"
          count=${#pending_shas[@]}
          if (( count > 1 )); then
            echo "::error::Found ${count} merged Release Please PRs awaiting release."
            exit 1
          fi
          if (( count == 0 )); then
            exit 0
          fi
          release_sha=${pending_shas[0]}
          stable_tree=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${release_sha}" --jq .tree.sha)
          candidate_tree=$(npm view "${PUBLISHED_PACKAGE}@${RC_NPM_TAG}" tardigrade.sourceTree)
          if [ "$candidate_tree" != "$stable_tree" ]; then
            echo "::error::npm ${RC_NPM_TAG} was built from ${candidate_tree:-no recorded tree}; stable is ${stable_tree}."
            exit 1
          fi
          echo "npm ${RC_NPM_TAG} matches stable tree ${stable_tree}."
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
      - name: Pin release candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidates=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=${RELEASE_PR_PAGE_SIZE}" | jq -c --arg author "$RELEASE_PR_AUTHOR" --arg label "$RELEASE_PR_LABEL" --arg prefix "$RELEASE_PR_BRANCH_PREFIX" --arg repo "$GITHUB_REPOSITORY" '[.[] | select(.user.login == $author and .head.repo.full_name == $repo and (.head.ref | startswith($prefix)) and any(.labels[]; .name == $label))]')
          count=$(jq length <<< "$candidates")
          if (( count > 1 )); then
            echo "::error::Found ${count} open Release Please PRs against main."
            exit 1
          fi
          if (( count == 0 )); then
            exit 0
          fi
          echo "head=$(jq -r '.[0].head.sha' <<< "$candidates")" >> "$GITHUB_OUTPUT"
          echo "pr=$(jq -r '.[0].number' <<< "$candidates")" >> "$GITHUB_OUTPUT"

  publish-candidate:
    needs: release-please
    if: needs.release-please.outputs.candidate_head != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.candidate_base }}
      - name: Apply release candidate
        id: candidate-tree
        env:
          CANDIDATE_HEAD: ${{ needs.release-please.outputs.candidate_head }}
        run: |
          git fetch --no-tags origin "$CANDIDATE_HEAD"
          candidate_tree=$(git merge-tree --write-tree HEAD "$CANDIDATE_HEAD")
          git read-tree --reset -u "$candidate_tree"
          echo "sha=$candidate_tree" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun install --frozen-lockfile
      - run: bun run gate
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Read candidate version
        id: candidate
        run: echo "version=$(jq -r .version package.json)-${RC_TYPE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Publish candidate
        run: bun run tools/publish.ts --version ${{ steps.candidate.outputs.version }} --tag ${RC_NPM_TAG} --source-tree ${{ steps.candidate-tree.outputs.sha }}

  publish-stable:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.release_sha || github.sha }}
      - name: Read stable tree
        id: stable-tree
        run: echo "sha=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun install --frozen-lockfile
      - run: bun run gate
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Verify release candidate
        if: github.event_name != 'workflow_dispatch' || !inputs.dry-run
        env:
          STABLE_TREE: ${{ steps.stable-tree.outputs.sha }}
        run: |
          candidate_tree=$(npm view "${PUBLISHED_PACKAGE}@${RC_NPM_TAG}" tardigrade.sourceTree)
          if [ "$candidate_tree" != "$STABLE_TREE" ]; then
            echo "::error::npm ${RC_NPM_TAG} was built from ${candidate_tree:-no recorded tree}; stable is ${STABLE_TREE}."
            exit 1
          fi
          echo "npm ${RC_NPM_TAG} matches stable tree ${STABLE_TREE}."
      - name: Publish
        run: bun run tools/publish.ts --tag ${STABLE_NPM_TAG} --source-tree ${{ steps.stable-tree.outputs.sha }} ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && '--dry-run' || '' }}
