name: publish

# release-please keeps a stable release PR current on main. Each revision becomes an RC before its
# required checks pass. Merging it creates the GitHub release and publishes the stable version
# through OIDC. The workflow filename is part of the npm trust pin. bun publish does not speak OIDC,
# so tools/publish.ts packs with bun and uploads with npm.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack without publishing
        type: boolean
        default: true
      release_ref:
        description: Git ref to publish. Defaults to the workflow revision
        type: string
        default: ""

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISHED_PACKAGE: tardie
  RC_TYPE: rc
  RC_NPM_TAG: next
  RELEASE_PR_AUTHOR: github-actions[bot]
  RELEASE_PR_BRANCH_PREFIX: release-please--
  RELEASE_PR_LABEL: "autorelease: pending"
  STABLE_NPM_TAG: latest

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      candidate_base: ${{ github.sha }}
      candidate_head: ${{ steps.candidate.outputs.head }}
      release_created: ${{ steps.release.outputs.release_created }}
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
      - name: Pin release candidate
        id: candidate
        if: steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidates=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" | jq -c --arg author "$RELEASE_PR_AUTHOR" --arg label "$RELEASE_PR_LABEL" --arg prefix "$RELEASE_PR_BRANCH_PREFIX" --arg repo "$GITHUB_REPOSITORY" '[.[] | select(.user.login == $author and .head.repo.full_name == $repo and (.head.ref | startswith($prefix)) and any(.labels[]; .name == $label))]')
          count=$(jq length <<< "$candidates")
          if (( count > 1 )); then
            echo "::error::Found ${count} open Release Please PRs against main."
            exit 1
          fi
          if (( count == 1 )); then
            echo "head=$(jq -r '.[0].head.sha' <<< "$candidates")" >> "$GITHUB_OUTPUT"
          fi

  publish-candidate:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.candidate_head != '' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      checks: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref || needs.release-please.outputs.candidate_base || github.sha }}
      - name: Apply release candidate
        if: github.event_name == 'push'
        env:
          CANDIDATE_HEAD: ${{ needs.release-please.outputs.candidate_head }}
        run: |
          git fetch --no-tags origin "$CANDIDATE_HEAD"
          candidate_tree=$(git merge-tree --write-tree HEAD "$CANDIDATE_HEAD")
          git read-tree --reset -u "$candidate_tree"
      - name: Read candidate tree
        id: candidate-tree
        run: echo "sha=$(git write-tree)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun install --frozen-lockfile
      - run: bun run gate
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Read candidate version
        id: candidate
        run: echo "version=$(jq -r .version package.json)-${RC_TYPE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Publish candidate
        run: bun run tools/publish.ts --version ${{ steps.candidate.outputs.version }} --tag ${RC_NPM_TAG} --source-tree ${{ steps.candidate-tree.outputs.sha }}
      - name: Record release PR checks
        if: needs.release-please.outputs.candidate_head != ''
        env:
          CANDIDATE_HEAD: ${{ needs.release-please.outputs.candidate_head }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for check in gate "validate pull request title"; do
            gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" -f name="$check" -f head_sha="$CANDIDATE_HEAD" -f status=completed -f conclusion=success >/dev/null
          done

  publish-stable:
    needs: [release-please, publish-candidate]
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') && (needs.publish-candidate.result == 'success' || needs.publish-candidate.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_ref || needs.release-please.outputs.release_sha || github.sha }}
      - name: Read stable tree
        id: stable-tree
        run: echo "sha=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun install --frozen-lockfile
      - run: bun run gate
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Verify release candidate
        if: github.event_name != 'workflow_dispatch' || !inputs.dry-run
        env:
          STABLE_TREE: ${{ steps.stable-tree.outputs.sha }}
        run: |
          candidate_tree=$(npm view "${PUBLISHED_PACKAGE}@${RC_NPM_TAG}" tardigrade.sourceTree)
          if [ "$candidate_tree" != "$STABLE_TREE" ]; then
            echo "::error::npm ${RC_NPM_TAG} was built from ${candidate_tree:-no recorded tree}; stable is ${STABLE_TREE}."
            exit 1
          fi
          echo "npm ${RC_NPM_TAG} matches stable tree ${STABLE_TREE}."
      - name: Publish
        run: bun run tools/publish.ts --tag ${STABLE_NPM_TAG} --source-tree ${{ steps.stable-tree.outputs.sha }} ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && '--dry-run' || '' }}
