name: conventional commits

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: conventional-commits-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-title:
    name: validate pull request title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^()[:space:]]+\))?: [^[:space:]].*$'
          if [[ ! ${PR_TITLE} =~ ${pattern} ]]; then
            echo "::error title=Invalid pull request title::Use type(scope?): message with an allowed Conventional Commit type."
            exit 1
          fi
          subject=${PR_TITLE#*: }
          read -r -a words <<< "${subject}"
          if (( ${#words[@]} < 3 || ${#words[@]} > 5 )); then
            echo "::error title=Invalid pull request title::Keep the message to 3-5 words."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Reject AI co-author trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nocasematch
          while IFS= read -r sha; do
            while IFS= read -r trailer; do
              key=${trailer%%:*}
              value=${trailer#*:}
              if [[ ${key} == "co-authored-by" && ${value} =~ (^|[^[:alnum:]_])(claude|cursor|codex)([^[:alnum:]_]|$) ]]; then
                echo "::error title=Prohibited co-author::Commit ${sha} contains ${trailer}"
                exit 1
              fi
            done < <(git show -s --format=%B "${sha}" | git interpret-trailers --parse)
          done < <(git rev-list "${BASE_SHA}..${HEAD_SHA}")
