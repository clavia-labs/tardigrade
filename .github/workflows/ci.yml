name: ci

# The required gate runs on every PR and every push to main. Docs-only PRs check prose and build
# the web app; other PRs and pushes run the same full gate used locally.
# Releases are `.github/workflows/publish.yml` via release-please on main; this workflow does not
# publish.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# checkout is the only thing that touches the repo; nothing writes back.
permissions:
  contents: read

jobs:
  gate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - name: Detect docs-only PR
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if [[ -n "$changed_files" ]] && ! grep -Eqv '^docs/' <<< "$changed_files"; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      # --frozen-lockfile: a PR that changes deps without committing bun.lock fails here instead of
      # silently resolving something different from what everyone else installed.
      - run: bun install --frozen-lockfile
      - run: bun run gate --only=lint:docs,build:app-web
        if: steps.changes.outputs.docs_only == 'true'
      - run: bun run gate
        if: steps.changes.outputs.docs_only != 'true'

  deploy-web:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://tardigrade.sh
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun install --frozen-lockfile
      - run: bun install --global vercel@latest
      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p .vercel
          curl -fsS "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            | jq --arg orgId "$VERCEL_ORG_ID" --arg projectId "$VERCEL_PROJECT_ID" \
              '{orgId: $orgId, projectId: $projectId, projectName: .name, settings: {createdAt, framework, devCommand, installCommand, buildCommand, outputDirectory, rootDirectory, directoryListing, nodeVersion}}' \
              > .vercel/project.json
        working-directory: apps/web
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NITRO_PRESET: vercel
        working-directory: apps/web
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
