name: ci

# The gate runs on every PR and every push to main. `bun run gate` is the same command run locally
# (lint, Effect lint, typecheck, tests, knip), so CI green and local green mean the same thing.
# Releases are `.github/workflows/publish.yml` via release-please on main; this workflow does not
# publish.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# checkout is the only thing that touches the repo; nothing writes back.
permissions:
  contents: read

jobs:
  gate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      # --frozen-lockfile: a PR that changes deps without committing bun.lock fails here instead of
      # silently resolving something different from what everyone else installed.
      - run: bun install --frozen-lockfile
      - run: bun run gate

  deploy-web:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://tardigrade.sh
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun install --frozen-lockfile
      - run: bun install --global vercel@latest
      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p .vercel
          curl -fsS "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            | jq --arg orgId "$VERCEL_ORG_ID" --arg projectId "$VERCEL_PROJECT_ID" \
              '{orgId: $orgId, projectId: $projectId, projectName: .name, settings: {createdAt, framework, devCommand, installCommand, buildCommand, outputDirectory, rootDirectory, directoryListing, nodeVersion}}' \
              > .vercel/project.json
        working-directory: apps/web
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NITRO_PRESET: vercel
        working-directory: apps/web
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
