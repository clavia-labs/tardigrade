\* A child that never acknowledges cancellation prevents its parent from settling. Expected to FAIL CancellationSettles.
SPECIFICATION SpecWithoutChildAcknowledgement
CHECK_DEADLOCK FALSE
CONSTANTS
  Invocations <- ModelInvocations
  Effects = {e1}
  Calls = {c1}
  Links <- ModelLinks
  RequestIds = {x1, x2}
  Target <- MessageInvocation
INVARIANT TypeOK
PROPERTY CancellationSettles
