\* ISOLATION: every healthy thread is eventually served with a poisoned
\* thread in the pass. Expected to PASS: the per-visit catch in
\* HostSupervisor.alarm is the implementation half.
SPECIFICATION LiveSpec
CHECK_DEADLOCK FALSE
CONSTANTS
  Threads = {l1, l2}
  MaxCrashes = 1
  Poisoned = {l2}
  GiveUpLimit = 2
INVARIANT TypeOK
INVARIANT Accounting
PROPERTY HealthyServed
