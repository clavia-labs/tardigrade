\* REST: a lane whose visits always crash eventually rests. Expected
\* to PASS: GiveUp discharges the lane at the tries limit, so the
\* property holds with the poisoned lane's crashes unbounded.
SPECIFICATION LiveSpec
CONSTANTS
  Lanes = {l1, l2}
  MaxCrashes = 1
  Poisoned = {l2}
  GiveUpLimit = 2
INVARIANT TypeOK
INVARIANT Accounting
PROPERTY EventuallyServed
