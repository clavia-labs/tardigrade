\* SERIAL: the guard speaks only between attempts. Expected to PASS:
\* a verdict implies every counted attempt ended empty, and the verdict
\* settles the execution, so no result can follow it.
\* Run TLC with -deadlock: the module ends at rest by design.
SPECIFICATION SpecSerial
CONSTANTS
  Limit = 3
  MaxLen = 3
INVARIANT TypeOK
INVARIANT NoDoubleOutcome
