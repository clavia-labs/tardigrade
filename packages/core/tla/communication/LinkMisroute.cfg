\* LinkMisroute is expected to fail when delivery appends at the source.
SPECIFICATION MisrouteSpec
CHECK_DEADLOCK FALSE
CONSTANTS
  Identities <- TinyIdentities
  Destinations <- TinyDestinations
  Links <- TinyLinks
  Envelopes <- TinyEnvelopes
  LinkOf <- TinyLinkOf
  InitialDirectory <- TinyDirectory
  MaxAttempts = 1
  None = "none"
INVARIANT NoMisroute
