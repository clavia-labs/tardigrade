\* LinkStale is expected to fail after a target moves while its cached destination remains.
SPECIFICATION StaleSpec
CHECK_DEADLOCK FALSE
CONSTANTS
  Identities <- TinyIdentities
  Destinations <- TinyDestinations
  Links <- TinyLinks
  Envelopes <- TinyEnvelopes
  LinkOf <- TinyLinkOf
  InitialDirectory <- TinyDirectory
  MaxAttempts = 2
  None = "none"
INVARIANT ResolvedIsFresh
