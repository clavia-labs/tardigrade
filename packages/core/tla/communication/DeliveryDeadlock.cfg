\* The deadlock: two lanes await each other. Every invariant content,
\* no lane ever settles. Expected to FAIL the liveness property: the
\* trace is the eternal rest packages/host/src/deadlock.ts breaks.
SPECIFICATION LiveSpec
CHECK_DEADLOCK FALSE
CONSTANTS
  Lanes <- KnotLanes
  Roots <- KnotRoots
  Briefs <- KnotBriefs
  Awaits <- KnotAwaits
INVARIANT TypeOK
INVARIANT SettledAreDispatched
PROPERTY AllSettle
