\* Link checks routing, deduplication, and migration safety.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Identities <- ModelIdentities
  Destinations <- ModelDestinations
  Links <- ModelLinks
  Envelopes <- ModelEnvelopes
  LinkOf <- ModelLinkOf
  InitialDirectory <- ModelDirectory
  MaxAttempts = 2
  None = "none"
INVARIANT TypeOK
INVARIANT NoMisroute
INVARIANT AtMostOnce
INVARIANT CommittedExactlyLogged
INVARIANT ResolvedIsFresh
