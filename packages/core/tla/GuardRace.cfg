\* RACY: the guard reads state mid-attempt. Expected to FAIL: the trace
\* is a slow body counted as dead, the verdict landing while it runs,
\* and its real result arriving after: two terminal stories for one
\* execution.
\* Run TLC with -deadlock: the module ends at rest by design.
SPECIFICATION SpecRacy
CONSTANTS
  Limit = 3
  MaxLen = 3
INVARIANT TypeOK
INVARIANT NoDoubleOutcome
