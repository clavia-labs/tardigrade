\* The deadlock: two threads await each other. Every invariant content,
\* no thread ever settles. Expected to FAIL the liveness property: the
\* trace is the eternal rest packages/host/src/deadlock.ts breaks.
SPECIFICATION LiveSpec
CHECK_DEADLOCK FALSE
CONSTANTS
  Threads <- KnotThreads
  Roots <- KnotRoots
  Briefs <- KnotBriefs
  Awaits <- KnotAwaits
  Services <- KnotServices
INVARIANT TypeOK
INVARIANT SettledAreDispatched
PROPERTY AllSettle
