\* MethodAlarm checks that recorded deadlines terminate calls without assuming method resolution.
SPECIFICATION AlarmSpec
CHECK_DEADLOCK FALSE
CONSTANTS
  Addresses <- ModelAddresses
  Calls <- ModelCalls
  Methods <- ModelMethods
  CallLink <- ModelCallLink
  CallMethod <- ModelCallMethod
  CallTimeout <- ModelCallTimeout
INVARIANT TypeOK
INVARIANT AtMostOneCallerTerminal
INVARIANT DispatchedCallsHaveDeadlines
INVARIANT AlarmsFireAtDeadlines
INVARIANT ClockRecordsAlarmFirings
INVARIANT TimedOutCallsCrossedDeadline
PROPERTY AllDispatchedCallsTerminate
