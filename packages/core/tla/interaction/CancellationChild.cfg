\* Settling before every live child receives cancellation violates child propagation. Expected to FAIL ChildrenCancelled.
SPECIFICATION SpecWithoutChildCancellation
CHECK_DEADLOCK FALSE
CONSTANTS
  Invocations <- ModelInvocations
  Effects = {e1}
  Calls = {c1}
  Links <- ModelLinks
  RequestIds = {x1, x2}
  Target <- MessageInvocation
INVARIANT TypeOK
INVARIANT ChildrenCancelled
