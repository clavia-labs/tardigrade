\* Starting an effect after the request violates the durable cancellation cut. Expected to FAIL NoNewEffects.
SPECIFICATION SpecEffectLeak
CHECK_DEADLOCK FALSE
CONSTANTS
  Invocations <- ModelInvocations
  Effects = {e1}
  Calls = {c1}
  Links <- ModelLinks
  RequestIds = {x1, x2}
  Target <- MessageInvocation
INVARIANT TypeOK
INVARIANT NoNewEffects
