\* Settling before every admitted effect receives its stop signal violates terminal ordering. Expected to FAIL OldEffectsSignalled.
SPECIFICATION SpecWithoutSignals
CHECK_DEADLOCK FALSE
CONSTANTS
  Invocations <- ModelInvocations
  Effects = {e1}
  Calls = {c1}
  Links <- ModelLinks
  RequestIds = {x1, x2}
  Target <- MessageInvocation
INVARIANT TypeOK
INVARIANT OldEffectsSignalled
