\* Settling with a call open at the cancellation cut violates durable call cleanup. Expected to FAIL OpenCallsTerminated.
SPECIFICATION SpecWithOpenCalls
CHECK_DEADLOCK FALSE
CONSTANTS
  Invocations <- ModelInvocations
  Effects = {e1}
  Calls = {c1}
  Links <- ModelLinks
  RequestIds = {x1, x2}
  Target <- MessageInvocation
INVARIANT TypeOK
INVARIANT OpenCallsTerminated
