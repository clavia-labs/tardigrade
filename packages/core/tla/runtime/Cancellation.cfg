  Invocations <- ModelInvocations
  Effects = {e1}
  Calls = {c1}
  Links <- ModelLinks
  RequestIds = {x1, x2}
  Target <- MessageInvocation
INVARIANT TypeOK
INVARIANT ExactRequestTarget
INVARIANT DuplicateRequestsAbsorb
INVARIANT NoNewEffects
INVARIANT OldEffectsSignalled
INVARIANT OpenCallsTerminated
INVARIANT ChildrenCancelled
INVARIANT InvocationCancelledLast
