\* ThreadConflict must violate CreationOnce when a competing parent overwrites accepted lineage.
SPECIFICATION OverwriteSpec
CHECK_DEADLOCK FALSE
CONSTANTS
  Threads <- ModelThreads
  Requests <- ModelRequests
  TargetOf <- ModelTarget
  ParentOf <- ModelParent
  DepthOf <- ModelDepth
  MaxAttempts = 2
  MaxDepth = 7
  None = "none"
INVARIANT CreationOnce
