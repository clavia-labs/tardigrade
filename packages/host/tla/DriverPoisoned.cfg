\* REST: a thread whose visits always crash eventually rests. Expected
\* to PASS: GiveUp discharges the thread at the tries limit, so the
\* property holds with the poisoned thread's crashes unbounded.
SPECIFICATION LiveSpec
CHECK_DEADLOCK FALSE
CONSTANTS
  Threads = {l1, l2}
  MaxCrashes = 1
  Poisoned = {l2}
  GiveUpLimit = 2
INVARIANT TypeOK
INVARIANT Accounting
PROPERTY EventuallyServed
