\* ThreadDepth must violate LineageValid when an initial delivery supplies unvalidated depth.
SPECIFICATION TrustSpec
CHECK_DEADLOCK FALSE
CONSTANTS
  Threads <- ModelThreads
  Requests <- ModelRequests
  TargetOf <- ModelTarget
  ParentOf <- ModelParent
  DepthOf <- ModelDepth
  MaxAttempts = 2
  MaxDepth = 7
  None = "none"
INVARIANT LineageValid
