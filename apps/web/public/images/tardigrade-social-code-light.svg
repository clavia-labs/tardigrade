<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Harness from an event log</title>
  <description id="description">A harness is a function of an event log. A point on a trajectory is derived from all previous points.</description>

  <rect width="1200" height="630" fill="#f8f7f2"/>

  <text x="600" y="188" fill="#101521" font-family="Georgia, 'Times New Roman', serif" font-size="48" text-anchor="middle">
    harness = <tspan font-style="italic">f</tspan><tspan dx="3.5">(event log)</tspan>
  </text>

  <g transform="translate(66 240) scale(1.48)">
    <path d="M28 92C70 78 92 106 132 94C176 80 202 54 246 70C294 88 326 94 370 76C412 60 452 90 492 68C544 40 590 84 636 66C660 58 676 56 692 54" fill="none" stroke="#8ea7ff" stroke-width="1.1" vector-effect="non-scaling-stroke"/>
    <g fill="#f8f7f2" stroke="#7894ff" stroke-width="1" vector-effect="non-scaling-stroke">
      <rect x="24.5" y="88.5" width="7" height="7"/>
      <rect x="128.5" y="90.5" width="7" height="7"/>
      <rect x="242.5" y="66.5" width="7" height="7"/>
      <rect x="366.5" y="72.5" width="7" height="7"/>
      <rect x="488" y="64" width="8" height="8" fill="#edf2ff" stroke="#2450ff" stroke-width="1.4"/>
      <rect x="632.5" y="62.5" width="7" height="7"/>
      <rect x="688.5" y="50.5" width="7" height="7"/>
    </g>
    <path d="M492 68L532 46M524 46H532L529 54" fill="none" stroke="#2450ff" stroke-width="1.25" vector-effect="non-scaling-stroke"/>
    <text x="548" y="35" fill="#2450ff" font-family="'IBM Plex Mono', Menlo, Monaco, monospace" font-size="13" text-anchor="middle">f(previous points)</text>
  </g>

  <text x="1140" y="584" fill="#526073" font-family="'IBM Plex Mono', Menlo, Monaco, monospace" font-size="18" text-anchor="end">tardigrade.sh</text>
</svg>
