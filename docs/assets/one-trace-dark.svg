  <line x1="36.95349999999999" y1="176.2" x2="36.95349999999999" y2="213.1" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <line x1="170.0465" y1="176.2" x2="170.0465" y2="213.1" stroke="var(--_node-stroke)" stroke-width="0.75" />
